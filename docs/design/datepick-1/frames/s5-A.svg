<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640"><style>text{font-family:"Segoe UI",system-ui,sans-serif}
.ring{opacity:0;animation:ring 100ms linear 200ms both}@keyframes ring{from{opacity:0}to{opacity:1}}
.pop{transform-box:fill-box;transform-origin:50% 0;animation:open 180ms cubic-bezier(0,0,0,1) 300ms both}@keyframes open{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.press{opacity:0;animation:press 300ms linear 1000ms both}@keyframes press{0%{opacity:0}40%{opacity:.18}100%{opacity:0}}
.m1{opacity:0;animation:mout 200ms cubic-bezier(0.2,0,0,1) 1200ms both}@keyframes mout{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-16px)}}
.m2{animation:min 200ms cubic-bezier(0.2,0,0,1) 1200ms both}@keyframes min{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
